<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content}, 'devices')}">

<head>
    <title>Devices</title>
</head>

<body>
    <div th:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-dark">Linked Accounts</h2>
            <a href="/admin" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Back to Dashboard</a>
        </div>

        <div class="card-custom">
            <div class="card-header-custom">Active Enrollment Codes</div>
            <div class="table-responsive">
                <table class="table-custom">
                    <thead>
                        <tr>
                            <th>Enrollment Code / ID</th>
                            <th>Assigned Name</th>
                            <th>Department</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="device : ${devices}">
                            <td>
                                <span class="font-monospace small bg-light p-1 rounded text-muted"
                                    th:text="${device.deviceId}">UUID</span>
                            </td>
                            <td>
                                <div th:if="${device.name != null}" class="d-flex align-items-center gap-2">
                                    <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center"
                                        style="width: 28px; height: 28px; font-size: 0.8rem;">
                                        <span th:text="${#strings.substring(device.name,0,1)}">A</span>
                                    </div>
                                    <span th:text="${device.name}" class="fw-medium">John Doe</span>
                                </div>
                                <span th:if="${device.name == null}" class="text-muted fst-italic">Unassigned</span>
                            </td>
                            <td>
                                <span th:if="${device.department != null}" class="badge-custom badge-neutral"
                                    th:text="${device.department}">Eng</span>
                                <span th:if="${device.department == null}" class="text-muted">-</span>
                            </td>
                            <td class="text-end">
                                <a th:href="@{'/admin/activity/' + ${device.deviceId}}"
                                    class="btn btn-sm btn-outline-secondary me-1">
                                    <i class="bi bi-activity"></i> Activity
                                </a>
                                <button class="btn btn-sm btn-outline-primary" th:data-id="${device.deviceId}"
                                    th:data-name="${device.name}" th:data-dept="${device.department}"
                                    onclick="editDevice(this)" data-bs-toggle="modal" data-bs-target="#editModal">
                                    <i class="bi bi-pencil"></i> Edit
                                </button>
                            </td>
                        </tr>
                        <tr th:if="${devices.empty}">
                            <td colspan="4" class="text-center p-4 text-muted">No devices found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Edit Modal -->
        <div class="modal fade" id="editModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <form action="/admin/employees" method="post">
                        <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
                        <div class="modal-header">
                            <h5 class="modal-title fw-bold">Edit Device Assignment</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <input type="hidden" id="modalDeviceId" name="deviceId">
                            <div class="mb-3">
                                <label class="form-label text-muted small fw-bold uppercase">Device ID</label>
                                <input type="text" class="form-control font-monospace bg-light" id="displayDeviceId"
                                    disabled>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-muted small fw-bold uppercase">Employee Name</label>
                                <input type="text" class="form-control" id="modalName" name="name"
                                    placeholder="E.g. John Doe" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-muted small fw-bold uppercase">Department</label>
                                <input type="text" class="form-control" id="modalDepartment" name="department"
                                    placeholder="E.g. Engineering">
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary-custom">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <script>
            function editDevice(btn) {
                const id = btn.getAttribute('data-id');
                const name = btn.getAttribute('data-name');
                const dept = btn.getAttribute('data-dept');

                document.getElementById('modalDeviceId').value = id;
                document.getElementById('displayDeviceId').value = id;
                document.getElementById('modalName').value = (name === 'null' || !name) ? '' : name;
                document.getElementById('modalDepartment').value = (dept === 'null' || !dept) ? '' : dept;
            }
        </script>
    </div>
</body>

</html>
