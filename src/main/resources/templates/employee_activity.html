<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content}, 'activity')}">

<head>
    <title>Employee Activity</title>
</head>

<body>
    <div th:fragment="content">
        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="d-flex align-items-center gap-3">
                <a href="/admin" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <div>
                    <h2 class="fw-bold text-dark mb-0"
                        th:text="${employee.name != null ? employee.name : 'Unknown Device'}">Employee</h2>
                    <div class="d-flex align-items-center gap-2 mt-1">
                        <span class="badge-custom badge-neutral" th:if="${employee.department != null}"
                            th:text="${employee.department}">Dept</span>
                        <span class="small text-muted font-monospace" th:text="${employee.deviceId}">UUID</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filter Bar -->
        <div class="card-custom mb-4">
            <div class="card-header-custom d-flex align-items-center gap-2">
                <i class="bi bi-funnel"></i> Filters
            </div>
            <div class="p-3">
                <form method="get" th:action="@{'/admin/activity/' + ${employee.deviceId}}"
                    class="row g-3 align-items-end">
                    <div class="col-md-3">
                        <label class="form-label small text-muted fw-bold">Start Date</label>
                        <input type="date" class="form-control" name="startDate" th:value="${filterStartDate}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small text-muted fw-bold">End Date</label>
                        <input type="date" class="form-control" name="endDate" th:value="${filterEndDate}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small text-muted fw-bold">Domain</label>
                        <select class="form-select" name="domain">
                            <option value="">All Domains</option>
                            <option th:each="d : ${domains}" th:value="${d}" th:text="${d}"
                                th:selected="${d == filterDomain}">domain.com</option>
                        </select>
                    </div>
                    <div class="col-md-3 d-flex gap-2">
                        <button type="submit" class="btn btn-primary-custom">
                            <i class="bi bi-search"></i> Apply
                        </button>
                        <a th:href="@{'/admin/activity/' + ${employee.deviceId}}" class="btn btn-outline-secondary">
                            <i class="bi bi-x-circle"></i> Clear
                        </a>
                    </div>
                </form>
            </div>
        </div>

        <!-- Summary Cards -->
        <div class="row g-4 mb-4">
            <div class="col-md-4">
                <div class="card-custom stat-card">
                    <div>
                        <div class="stat-title">Total Time</div>
                        <div class="stat-value" th:text="${totalDuration}">0h 0m</div>
                    </div>
                    <i class="bi bi-hourglass-split stat-icon"></i>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card-custom stat-card">
                    <div>
                        <div class="stat-title">Total Visits</div>
                        <div class="stat-value" th:text="${logCount}">0</div>
                    </div>
                    <i class="bi bi-globe stat-icon"></i>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card-custom stat-card">
                    <div>
                        <div class="stat-title">Top Domain</div>
                        <div class="stat-value" style="font-size: 1.2rem;" th:text="${topDomain}">-</div>
                    </div>
                    <i class="bi bi-trophy stat-icon"></i>
                </div>
            </div>
        </div>

        <!-- Main Layout: Sidebar + Content -->
        <div class="row g-4">
            <!-- Left Sidebar: Domain Breakdown -->
            <div class="col-md-4">
                <div class="card-custom">
                    <div class="card-header-custom">
                        <i class="bi bi-pie-chart"></i> Time by Domain
                    </div>
                    <div class="p-3">
                        <div class="list-group list-group-flush border-0">
                            <div th:each="stat : ${domainStats}" class="list-group-item border-0 px-0 mb-3">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <a th:href="@{'/admin/activity/' + ${employee.deviceId}(startDate=${filterStartDate}, endDate=${filterEndDate}, domain=${stat.domain})}"
                                        class="fw-bold text-decoration-none text-dark d-flex align-items-center gap-2"
                                        th:classappend="${stat.domain == filterDomain ? 'text-primary' : ''}">
                                        <i class="bi bi-globe2 small"></i>
                                        <span th:text="${stat.domain}">domain.com</span>
                                    </a>
                                    <span class="small text-muted fw-medium" th:text="${stat.formattedDuration}">0h
                                        10m</span>
                                </div>
                                <div class="progress" style="height: 6px;">
                                    <div class="progress-bar bg-primary" role="progressbar"
                                        th:style="'width: ' + ${stat.percentage} + '%'"
                                        th:attr="aria-valuenow=${stat.percentage}" aria-valuemin="0"
                                        aria-valuemax="100">
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div th:if="${domainStats.empty}" class="text-center py-4 text-muted small">
                            No domain activity recorded.
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Content: Activity Table -->
            <div class="col-md-8">
                <div class="card-custom">
                    <div class="card-header-custom d-flex justify-content-between align-items-center">
                        <div>
                            <i class="bi bi-list-ul"></i> Activity Logs
                            <span th:if="${filterDomain != null && !filterDomain.empty}" class="ms-2">
                                <span
                                    class="badge bg-primary-subtle text-primary border border-primary-subtle fw-normal">
                                    Filtering: <span th:text="${filterDomain}">domain.com</span>
                                </span>
                            </span>
                        </div>
                        <span class="badge bg-secondary" th:text="${logCount} + ' records'">0 records</span>
                    </div>
                    <div class="table-responsive">
                        <table class="table-custom">
                            <thead>
                                <tr>
                                    <th>URL / Page</th>
                                    <th>Time</th>
                                    <th>Duration</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="log : ${logs}">
                                    <td>
                                        <div class="d-flex flex-column">
                                            <a th:href="${log.url}" target="_blank"
                                                class="fw-bold text-dark text-decoration-none small text-truncate d-block"
                                                style="max-width: 400px;" th:text="${log.url}">http://...</a>
                                            <div class="small text-muted" th:text="${log.domain}">domain.com</div>
                                        </div>
                                    </td>
                                    <td class="text-muted small" th:text="${#temporals.format(log.startTime, 'HH:mm')}">
                                        12:00</td>
                                    <td>
                                        <span class="badge-custom badge-neutral"
                                            th:text="${log.durationSeconds + 's'}">60s</span>
                                    </td>
                                </tr>
                                <tr th:if="${logs.empty}">
                                    <td colspan="3" class="text-center p-5 text-muted">
                                        <i class="bi bi-inbox" style="font-size: 2rem;"></i>
                                        <div class="mt-2">No activity found for the selected filters.</div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
