<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::content}, 'dashboard')}">

<head>
    <title>Dashboard</title>
</head>

<body>
    <div th:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-dark">Dashboard</h2>
            <div>
                <a href="/admin/devices" class="btn btn-primary-custom me-2"><i class="bi bi-laptop"></i> Manage
                    Devices</a>
                <a href="/admin" class="btn btn-outline-secondary"><i class="bi bi-arrow-clockwise"></i> Refresh</a>
            </div>
        </div>

        <!-- Summary Cards -->
        <div class="row g-4 mb-4">
            <div class="col-md-4">
                <div class="card-custom stat-card">
                    <div>
                        <div class="stat-title">Total Employees</div>
                        <div class="stat-value" th:text="${totalEmployees}">0</div>
                    </div>
                    <i class="bi bi-people stat-icon"></i>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card-custom stat-card">
                    <div>
                        <div class="stat-title">Total Time Tracked</div>
                        <div class="stat-value" th:text="${totalDuration}">0h 0m</div>
                    </div>
                    <i class="bi bi-hourglass-split stat-icon"></i>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card-custom stat-card">
                    <div>
                        <div class="stat-title">Active Today</div>
                        <div class="stat-value" th:text="${activeToday}">0</div>
                    </div>
                    <i class="bi bi-activity stat-icon"></i>
                </div>
            </div>
        </div>

        <!-- Charts Row -->
        <div class="row g-4 mb-4">
            <div class="col-md-8">
                <div class="card-custom">
                    <div class="card-header-custom">Activity by Hour</div>
                    <div class="p-3">
                        <canvas id="activityChart" height="100"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card-custom">
                    <div class="card-header-custom">Top Domains</div>
                    <div class="p-3">
                        <canvas id="domainChart" height="200"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Recent Activity Table -->
        <div class="card-custom">
            <div class="card-header-custom">Recent Activity Logs</div>
            <div class="table-responsive">
                <table class="table-custom">
                    <thead>
                        <tr>
                            <th>User / Device</th>
                            <th>Activity</th>
                            <th>Time</th>
                            <th>Duration</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="log : ${logs}">
                            <td>
                                <div>
                                    <div class="d-flex align-items-center gap-2">
                                        <div class="bg-light rounded-circle d-flex align-items-center justify-content-center text-muted"
                                            style="width: 32px; height: 32px;">
                                            <i class="bi bi-person"></i>
                                        </div>
                                        <div>
                                            <a th:href="@{'/admin/activity/' + ${log.deviceId}}"
                                                class="fw-bold text-decoration-none text-dark"
                                                th:text="${employeeMap.containsKey(log.deviceId) ? employeeMap.get(log.deviceId) : 'Unknown Device'}">
                                                User</a>
                                            <div class="small text-muted" th:text="${log.deviceId}"
                                                style="font-size: 0.75rem;">UUID</div>
                                        </div>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <div class="fw-bold" th:text="${log.domain}">example.com</div>
                                <a th:href="${log.url}" target="_blank"
                                    class="small text-muted text-decoration-none text-truncate d-block"
                                    style="max-width: 300px;" th:text="${log.url}">http://...</a>
                            </td>
                            <td class="text-muted" th:text="${#temporals.format(log.startTime, 'yyyy-MM-dd HH:mm')}">
                                Date</td>
                            <td>
                                <span class="badge-custom badge-neutral"
                                    th:text="${log.durationSeconds + 's'}">60s</span>
                            </td>
                        </tr>
                        <tr th:if="${logs.empty}">
                            <td colspan="4" class="text-center p-4 text-muted">No activity found.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Chart Data Injection -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        const activityData = /*[[${chartActivityByHour}]]*/[];
        const domainData = /*[[${chartTopDomains}]]*/[];

        // Process Activity Data (Hour 0-23)
        const hours = Array.from({ length: 24 }, (_, i) => i);
        const activityCounts = hours.map(h => {
            const found = activityData.find(d => d.hour === h);
            return found ? found.totalDuration : 0;
        });

        // Activity Chart
        const ctxActivity = document.getElementById('activityChart').getContext('2d');
        new Chart(ctxActivity, {
            type: 'bar',
            data: {
                labels: hours.map(h => h + ":00"),
                datasets: [{
                    label: 'Seconds Active',
                    data: activityCounts,
                    backgroundColor: '#4f46e5',
                    borderRadius: 4
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true, grid: { borderDash: [2, 2] } }, x: { grid: { display: false } } }
            }
        });

        // Top Domains Chart
        const domainLabels = domainData.map(d => d.domain);
        const domainValues = domainData.map(d => d.totalDuration);
        const ctxDomain = document.getElementById('domainChart').getContext('2d');
        new Chart(ctxDomain, {
            type: 'doughnut',
            data: {
                labels: domainLabels,
                datasets: [{
                    data: domainValues,
                    backgroundColor: ['#4f46e5', '#818cf8', '#c7d2fe', '#e0e7ff', '#f1f5f9'],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { position: 'bottom', labels: { usePointStyle: true, boxWidth: 8 } } }
            }
        });
        /*]]>*/
    </script>
</body>

</html>
