<!DOCTYPE html>
<html th:fragment="layout(content, activePage)" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Employee</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom CSS -->
    <link th:href="@{/css/dashboard.css}" rel="stylesheet">
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-brand">
            <i class="bi bi-stopwatch"></i> Watch Employee
        </div>
        <nav class="sidebar-nav">
            <a href="/admin" class="nav-item" th:classappend="${activePage == 'dashboard' ? 'active' : ''}">
                <i class="bi bi-grid-1x2-fill"></i> Dashboard
            </a>
            <a href="/admin/devices" class="nav-item" th:classappend="${activePage == 'devices' ? 'active' : ''}">
                <i class="bi bi-laptop"></i> Devices
            </a>
            <a href="#" class="nav-item">
                <i class="bi bi-gear"></i> Settings
            </a>
        </nav>
        <div class="p-3 border-top">
            <div class="d-flex align-items-center gap-2">
                <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center"
                    style="width: 32px; height: 32px;">
                    A
                </div>
                <div>
                    <div class="small fw-bold">Admin</div>
                    <div class="small text-muted" style="font-size: 0.7rem;">Administrator</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <main class="main-content">
        <th:block th:replace="${content}"></th:block>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
